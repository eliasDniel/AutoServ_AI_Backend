services:
  postgres:
    image: postgres:17-alpine
    container_name: autoserv-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-autoserv_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:alpine
    container_name: autoserv-nats
    ports:
      - "4223:4222"
      - "8223:8222"
    command: ["-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  ms-auth:
    build:
      context: ./ms-auth
    container_name: autoserv-ms-auth
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-autoserv_db}?schema=identity
      - NATS_SERVICE=nats://nats:4222
      - JWT_SERVICE=${JWT_SECRET:-super-secret-key}
      - SEED_ADMIN_CORREO=${SEED_ADMIN_CORREO:-admin@autoserv.local}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-Admin12345}
      - SEED_ADMIN_NOMBRE=${SEED_ADMIN_NOMBRE:-Admin}
      - SEED_ADMIN_APELLIDO=${SEED_ADMIN_APELLIDO:-Taller}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

volumes:
  postgres_data:
